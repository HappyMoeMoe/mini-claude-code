[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-claude-code"
dynamic = ["version"]
description = "A modular Linux coding agent with local sessions, teams and stdio MCP"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["THIRD_PARTY_NOTICES.md"]
dependencies = ["anthropic>=0.125,<1", "python-dotenv>=1,<2", "PyYAML>=6,<7", "mcp==1.30.0", "jsonschema==4.25.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_api: calls the configured model API with real credentials and consumes API credits"]

[project.scripts]
mini-claude-code = "mini_claude_code.cli:main"

[tool.setuptools.dynamic]
version = {attr = "mini_claude_code.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

